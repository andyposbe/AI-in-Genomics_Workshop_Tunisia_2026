title: AI in Genomics 2026
description: >-
  Hands-on workshop on AI for structural biology and genomics.
  Tunisia, 14-18 September 2026. GetGenome and The Sainsbury Laboratory.

# Site address. Change these only if the repository moves to another account.

url: https://andyposbe.github.io
baseurl: /AI-in-Genomics_Workshop_Tunisia_2026

remote_theme: just-the-docs/just-the-docs@v0.10.1
color_scheme: aig

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts/__pycache__
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - GO-LIVE.md

# Navigation --------------------------------------------------------------
nav_external_links:
  - title: Repository on GitHub
    url: https://github.com/andyposbe/AI-in-Genomics_Workshop_Tunisia_2026
  - title: GetGenome
    url: https://getgenome.net/impact/ai-in-genomics

aux_links:
  "View on GitHub":
    - https://github.com/andyposbe/AI-in-Genomics_Workshop_Tunisia_2026
aux_links_new_tab: true

# Search ------------------------------------------------------------------
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  button: false

# Footer ------------------------------------------------------------------
footer_content: >-
  Delivered by GetGenome and The Sainsbury Laboratory, supported through the
  Bifrost initiative (Kamoun Lab, TSL).
  Teaching materials CC BY 4.0, code MIT.

back_to_top: true
back_to_top_text: "Back to top"

last_edit_timestamp: true
last_edit_time_format: "%b %e %Y"
gh_edit_link: true
gh_edit_link_text: "Suggest a change to this page"
gh_edit_repository: https://github.com/andyposbe/AI-in-Genomics_Workshop_Tunisia_2026
gh_edit_branch: main
gh_edit_view_mode: edit

heading_anchors: true

callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Try this
    color: green
  warning:
    title: Careful
    color: yellow
  facilitator:
    title: Facilitator note
    color: purple

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false
